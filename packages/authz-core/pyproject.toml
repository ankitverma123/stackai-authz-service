[project]
name = "authz-core"
version = "0.1.0"
description = "Embeddable Cedar-backed authorization engine"
requires-python = ">=3.12"
dependencies = ["cedarpy>=4.8.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authz_core"]
